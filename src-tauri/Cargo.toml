[package]
name = "shindeck"
version = "0.1.0"
description = "A fast, lightweight clip manager for NVIDIA ShadowPlay recordings"
authors = ["ShinDeck"]
edition = "2021"
rust-version = "1.80"

[lib]
name = "shindeck_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["protocol-asset"] }
tauri-plugin-dialog = "2"
tauri-plugin-single-instance = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rayon = "1.10"
percent-encoding = "2"
notify-debouncer-mini = "0.7"
image = { version = "0.25", default-features = false, features = ["jpeg", "png"] }
log = "0.4"

[target.'cfg(windows)'.dependencies]
windows = { version = "0.61", features = [
  "Win32_Foundation",
  "Win32_Graphics_Gdi",
  "Win32_System_Com",
  "Win32_System_Registry",
  "Win32_UI_Shell",
  "Win32_UI_Shell_Common",
] }

[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true
